<!-- Web/phone sign-in gate. Hidden entirely in the desktop app. -->
<div id="loginGate" class="hidden">
  <form id="loginForm">
    <h1>Sailing Books</h1>
    <p class="sub" id="loginSub">Connect to the library on your laptop</p>
    <label class="field" id="loginAddrField">
      <span>Laptop address</span>
      <input id="loginServer" type="text" placeholder="http://192.168.1.20:8787" autocomplete="off" spellcheck="false" />
      <div id="loginRecent"></div>
    </label>
    <label class="field">
      <span>Password</span>
      <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" />
    </label>
    <div id="loginError" class="err"></div>
    <button type="submit">Sign in</button>
    <div id="loginStatus" class="status"></div>
    <p class="hint" id="loginHint">Run <code>npm run tunnel</code> on the laptop, then open the address it prints here.</p>
  </form>
</div>
<style>
  #loginGate {
    position: fixed; inset: 0; z-index: 500; background: #fff;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  #loginGate.hidden { display: none; }
  #loginForm {
    width: min(360px, 100%); border: 1px solid var(--line); border-radius: 16px;
    padding: 28px 26px; box-shadow: var(--shadow); text-align: left;
  }
  #loginForm h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  #loginForm .sub { color: var(--muted); font-size: 13.5px; margin: 6px 0 20px; }
  #loginForm .field { display: block; margin-bottom: 12px; }
  #loginForm .field.hidden { display: none; }
  #loginForm .field span { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  #loginForm input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 14px; background: #fff; outline: none;
  }
  #loginForm input:focus { border-color: #d5d5d5; box-shadow: 0 0 0 3px #f4f4f4; }
  #loginForm button {
    width: 100%; margin-top: 6px; padding: 11px 14px; border: 0; border-radius: 10px;
    background: #1a1a1a; color: #fff; font-size: 14px; font-weight: 650; cursor: pointer;
  }
  #loginForm button:disabled { opacity: .55; cursor: default; }
  #loginForm .err { color: #c0392b; font-size: 12.5px; min-height: 17px; margin-top: 8px; }
  #loginForm .err:empty { margin: 0; min-height: 0; }
  #loginForm .status { color: var(--muted); font-size: 12.5px; min-height: 17px; }
  #loginForm .hint { color: #b5b5b5; font-size: 11.5px; line-height: 1.6; margin: 16px 0 0; border-top: 1px solid var(--line); padding-top: 12px; }
  #loginForm code { background: var(--soft); padding: 1px 5px; border-radius: 5px; }
  /* Recently used addresses: one tap instead of typing, for when the tunnel
     address has changed since last time. */
  #loginRecent { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #loginRecent:empty { display: none; }
  #loginRecent button {
    width: auto; margin: 0; padding: 5px 9px; border: 1px solid var(--line);
    background: #fff; color: var(--muted); font-size: 11.5px; font-weight: 500;
    border-radius: 99px; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  #loginRecent button.current { border-color: #1a1a1a; color: #1a1a1a; }
</style>
